# Publishes the workspace crates to crates.io.
#
# Called by the dist-generated release.yml as the custom publish job
# "./publish-crates" (see `publish-jobs` in dist-workspace.toml), after the
# GitHub Release and binaries exist. dist passes its release plan as the
# `plan` input.
#
# Authentication uses crates.io Trusted Publishing (OIDC): no API token is
# stored in the repository. Each crate must have a trusted publisher
# configured on crates.io for repository SwapShaOnline/hkconnect, workflow
# `release.yml` (the top-level workflow that calls this one) and
# environment `release`. See CONTRIBUTING.md, "Releasing".
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Protection rules (required reviewers, tag restrictions) can be added
    # to this environment in the repository settings.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the workspace version
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "hkconnect") | .version')
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match workspace version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish hkconnect, hkc, hkc-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Library first: the binaries depend on it. `cargo publish` waits
          # until each upload is in the index before returning.
          for crate in hkconnect hkc hkc-mcp; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: hkconnect-release-workflow (https://github.com/SwapShaOnline/hkconnect)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = "200" ]; then
              echo "$crate $VERSION is already on crates.io; skipping"
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "::error::unexpected HTTP $status checking $crate $VERSION on crates.io"
              exit 1
            fi
            cargo publish --locked -p "$crate"
          done
