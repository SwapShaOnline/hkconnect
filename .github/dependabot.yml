version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref (e.g. @1.89) selects the Rust toolchain for the MSRV job,
      # not a version of the action, so "upgrades" would break that check.
      - dependency-name: dtolnay/rust-toolchain
