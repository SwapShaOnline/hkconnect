[package]
name = "hkc-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read and control a Hyundai/Kia (India) connected car"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["hyundai", "kia", "bluelink", "mcp", "car"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
hkconnect = { version = "0.1.0", path = "../hkconnect" }
jiff = { version = "1.0.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[dev-dependencies]
http-body-util = "0.1.5"
pretty_assertions = "1.4.1"
rmcp = { version = "3.11.0", default-features = false, features = ["client", "server", "macros", "transport-async-rw"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints]
workspace = true
