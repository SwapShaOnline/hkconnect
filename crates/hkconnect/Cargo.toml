[package]
name = "hkconnect"
version = "0.1.0"
description = "Async client for Hyundai Bluelink India and Kia Connect India"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["hyundai", "kia", "bluelink", "connected-car", "telematics"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
documentation = "https://docs.rs/hkconnect"

[dependencies]
base64 = "0.23.1"
jiff = { version = "1.0.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "gzip", "rustls", "http2", "form", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "sync"] }
tracing = "0.1.44"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
