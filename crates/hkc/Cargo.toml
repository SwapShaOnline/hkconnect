[package]
name = "hkc"
version.workspace = true
description = "Command-line control for Hyundai/Kia connected cars in India"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["hyundai", "kia", "bluelink", "car", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
directories = "6.0.0"
hkconnect = { version = "0.1.2", path = "../hkconnect" }
jiff = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Lets `cargo binstall hkc` download the archives that dist attaches to
# each GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[lints]
workspace = true
