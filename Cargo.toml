[workspace]
resolver = "3"
members = ["crates/hkconnect", "crates/hkc", "crates/hkc-mcp"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SwapShaOnline/hkconnect"
authors = ["The hkconnect contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
